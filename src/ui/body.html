<div id="app">
  <canvas id="map" aria-label="Карта мира"></canvas>
  <div id="hud" hidden>
    <header id="top"></header>
    <div id="toasts" aria-live="polite"></div>
    <div id="bottom">
      <section id="card" hidden></section>
      <div class="spacer"></div>
      <div class="main-wrap">
        <div class="zoom">
          <button class="icon-btn" data-act="zoomIn" aria-label="Приблизить"></button>
          <button class="icon-btn" data-act="zoomOut" aria-label="Отдалить"></button>
        </div>
        <button class="ghost-btn" id="b-force" data-act="forceEnd" hidden></button>
        <button class="main-btn" id="b-main" data-act="main"></button>
      </div>
    </div>
    <aside id="sheet" hidden></aside>
  </div>
  <div id="modal" hidden></div>
  <div id="screen"></div>
  <div id="busy" hidden><div class="spinner"></div><span>Ходят соперники…</span></div>
</div>
